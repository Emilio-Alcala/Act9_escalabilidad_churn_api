<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierra Móvil · Riesgo de churn</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#5b6773;--br:#d7dde4;--acc:#1f6f8b;--ok:#2a9d8f;--med:#e0a31f;--hi:#c8452f}
  *{box-sizing:border-box} body{margin:0;font:15px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:920px;margin:0 auto;padding:24px 16px}
  h1{font-size:1.4rem;margin:0 0 4px} p.s{color:var(--mut);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:18px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
  select,input{width:100%;padding:7px 8px;border:1px solid var(--br);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{padding:9px 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
  button.sec{background:#e8edf2;color:var(--ink)}
  #res{display:none} .pill{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font-weight:600}
  .Bajo{background:var(--ok)} .Medio{background:var(--med)} .Alto{background:var(--hi)}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0 0} dt{color:var(--mut)} dd{margin:0}
  .err{color:var(--hi);margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Predicción de churn · Sierra Móvil</h1>
  <p class="s">Frontend HTML que consume el endpoint <code>POST /predict</code> del backend FastAPI. Documentación interactiva: <a href="/docs">/docs</a></p>

  <form id="f" class="card">
    <div class="grid" id="campos"></div>
    <div class="row">
      <button type="submit">Predecir</button>
      <button type="button" class="sec" id="ej1">Ejemplo: riesgo alto</button>
      <button type="button" class="sec" id="ej2">Ejemplo: riesgo bajo</button>
    </div>
    <div class="err" id="err"></div>
  </form>

  <section class="card" id="res">
    <span class="pill" id="nivel"></span>
    <dl>
      <dt>Probabilidad de churn</dt><dd id="prob"></dd>
      <dt>Umbral de decisión</dt><dd id="umb"></dd>
      <dt>Acción recomendada</dt><dd id="acc"></dd>
      <dt>Valor esperado de contactar</dt><dd id="val"></dd>
    </dl>
  </section>
</main>

<script>
const SN=["Yes","No"];
const CAMPOS=[
 ["gender","Género",["Male","Female"]],["SeniorCitizen","Adulto mayor",SN],["Partner","Pareja",SN],["Dependents","Dependientes",SN],
 ["tenure","Antigüedad (meses)","num"],["PhoneService","Servicio telefónico",SN],["MultipleLines","Múltiples líneas",SN],
 ["InternetService","Internet",["DSL","Fiber optic","No"]],["OnlineSecurity","Seguridad en línea",SN],["OnlineBackup","Respaldo en línea",SN],
 ["DeviceProtection","Protección de dispositivo",SN],["TechSupport","Soporte técnico",SN],["StreamingTV","Streaming TV",SN],
 ["StreamingMovies","Streaming películas",SN],["Contract","Contrato",["Month-to-month","One year","Two year"]],
 ["PaperlessBilling","Factura electrónica",SN],
 ["PaymentMethod","Método de pago",["Electronic check","Mailed check","Bank transfer (automatic)","Credit card (automatic)"]],
 ["MonthlyCharges","Cargo mensual (MXN)","num"],["TotalCharges","Cargo acumulado (MXN)","num"]];
const ALTO={gender:"Female",SeniorCitizen:"No",Partner:"No",Dependents:"No",tenure:3,PhoneService:"Yes",MultipleLines:"No",InternetService:"Fiber optic",OnlineSecurity:"No",OnlineBackup:"No",DeviceProtection:"No",TechSupport:"No",StreamingTV:"Yes",StreamingMovies:"Yes",Contract:"Month-to-month",PaperlessBilling:"Yes",PaymentMethod:"Electronic check",MonthlyCharges:89.45,TotalCharges:240.45};
const BAJO={gender:"Male",SeniorCitizen:"No",Partner:"Yes",Dependents:"Yes",tenure:72,PhoneService:"Yes",MultipleLines:"Yes",InternetService:"DSL",OnlineSecurity:"Yes",OnlineBackup:"Yes",DeviceProtection:"Yes",TechSupport:"Yes",StreamingTV:"No",StreamingMovies:"No",Contract:"Two year",PaperlessBilling:"No",PaymentMethod:"Credit card (automatic)",MonthlyCharges:64.5,TotalCharges:4644};
const $=id=>document.getElementById(id), box=$("campos");
CAMPOS.forEach(([k,t,o])=>{
  const d=document.createElement("div");
  d.innerHTML=`<label for="${k}">${t}</label>`+(o==="num"?`<input id="${k}" name="${k}" type="number" step="any" min="0" required>`:`<select id="${k}" name="${k}">${o.map(v=>`<option>${v}</option>`).join("")}</select>`);
  box.appendChild(d);
});
function cargar(d){for(const k in d)$(k).value=d[k]}
cargar(ALTO);
$("ej1").onclick=()=>cargar(ALTO); $("ej2").onclick=()=>cargar(BAJO);
$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent=""; $("res").style.display="none";
  const body={};
  CAMPOS.forEach(([k,,o])=>{const v=$(k).value; body[k]=o==="num"?(k==="tenure"?parseInt(v,10):parseFloat(v)):v});
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){$("err").textContent="Entrada inválida: "+(j.detail||[]).map(x=>x.loc.slice(-1)+" — "+x.msg).join("; ");return}
    $("nivel").textContent="Riesgo "+j.nivel_riesgo.toLowerCase(); $("nivel").className="pill "+j.nivel_riesgo;
    $("prob").textContent=(j.probabilidad_churn*100).toFixed(1)+" %"; $("umb").textContent=j.umbral;
    $("acc").textContent=j.accion_recomendada; $("val").textContent="$"+j.valor_esperado_contacto_mxn.toFixed(2)+" MXN";
    $("res").style.display="block";
  }catch(x){$("err").textContent="No se pudo contactar el backend: "+x}
});
</script>
</body>
</html>
